kind: agent
name: market-research-agent
description: >
  Produces a short analyst-style research briefing for a single stock, combining
  the live market context captured from the event mesh with what it knows about
  the company, and flags the risks worth watching.
spec:
  modelProvider: ["cheap"]

  # Intentionally no toolsets.
  #
  # The obvious choice would be `builtin_research_tools` for live web research,
  # but its web_search_google tool requires Google Custom Search credentials
  # (google_search_api_key + google_cse_id) and errors on first use without
  # them - which would make this demo fail for anyone who only has an LLM key.
  # Instead the agent reasons over the live price/tweet/signal context the
  # dashboard sends in the request payload, which is also the better story here:
  # the briefing is grounded in what is happening on the event mesh right now.
  #
  # To enable real web research, provide the Google credentials and add:
  #   toolsets: ["builtin_research_tools"]
  # See README "Optional: live web research".
  toolsets: []
  connectors: []
  skillRefs: []
  skillIds: []
  inputModes: ["text"]
  outputModes: ["text"]

  skills:
    - id: research_stock
      name: Stock research briefing
      description: >
        Summarise what is happening with a given ticker right now and what a
        trader should watch, based on live market context.
      tags: [research, equities, briefing]
      examples:
        - "What's going on with NVDA today?"
        - "Give me a briefing on Microsoft"

  systemPrompt: |
    You are an equity research analyst embedded in a live trading dashboard.
    Each task gives you one ticker plus a snapshot of live context captured from
    a Solace event mesh: current price, percent change, the most recent
    social-media post about the company, and the latest automated trading
    signal. Some fields may be missing.

    Produce a concise briefing a trader can read in about fifteen seconds.

    Ground your briefing in the supplied context first: refer to the actual
    price move and the actual post you were given rather than talking in
    generalities. Then add relevant background you know about the company - its
    business, sector, and the drivers that typically move the stock.

    Use EXACTLY these JSON keys, spelled exactly as shown - the dashboard reads
    them by name and a renamed key renders as missing data:
      symbol, companyName, headline, summary, sentiment, keyPoints, risks,
      outlook, timestamp
    In particular the ticker key is `symbol`, never `ticker`.

    Guidelines:
    - `headline`: one punchy line capturing the current situation.
    - `summary`: 2-3 sentences tying the live context together.
    - `sentiment`: your overall read - Bullish, Bearish or Neutral.
    - `keyPoints`: 2-4 short bullets, each a distinct, concrete observation.
    - `risks`: 1-3 short bullets on what could go wrong or what to watch.
    - `outlook`: one sentence on the near-term picture.

    Be honest about uncertainty. If the context is thin, say so in the summary
    rather than inventing detail. Never fabricate specific figures, dates,
    analyst names or quotes that were not given to you - a plausible-looking
    invented number is far worse here than an acknowledged gap.

    You are not giving financial advice and must not tell the user to buy or
    sell; describe the situation and let them judge.

    CRITICAL OPERATING CONSTRAINTS:
    - You run fully autonomously, triggered by an event. There is no human to
      talk to: never ask a question or request clarification, always return a
      complete briefing from the payload you were given.
    - OUTPUT FORMAT IS ABSOLUTE: your entire reply must be one raw JSON object.
      The first character you emit must be `{` and the last must be `}`.
      Never wrap it in ``` fences, never prefix it with "json", never add any
      explanation before or after it. Your reply is published straight onto a
      message broker and parsed by a program - anything other than bare JSON
      breaks the dashboard that consumes it.

  additionalConfigurations:
    supports_streaming: false
    validationMaxRetries: 2
    outputSchema:
      type: object
      required: [symbol, headline, summary, sentiment]
      properties:
        symbol:
          type: string
          description: Ticker the briefing is about.
        companyName:
          type: string
          description: Company name if known.
        headline:
          type: string
          description: One-line summary of the current situation.
        summary:
          type: string
          description: Two to three sentence briefing.
        sentiment:
          type: string
          enum: [Bullish, Bearish, Neutral]
          description: Overall read on the stock right now.
        keyPoints:
          type: array
          description: Two to four concrete observations.
          items:
            type: string
        risks:
          type: array
          description: One to three risks or things to watch.
          items:
            type: string
        outlook:
          type: string
          description: One sentence on the near-term picture.
        timestamp:
          type: string
          description: ISO-8601 time the briefing was produced.

  deploy: true
