kind: connector
name: market-history-connector
description: >
  Read-only SQL access to the market-history database: recorded price ticks,
  social-media posts, and trading signals. Used by market-historian-agent so the
  dashboard's chat window can answer questions about what already happened.
spec:
  type: sql
  subtype: postgres
  values:
    # Compose-network hostname; nothing here is reachable from the host.
    hostname: postgres
    port: 5432
    database: ${MARKET_HISTORY_DB, market_history}

    # ---------------------------------------------------------------------
    # This username is the security boundary, not a detail.
    #
    # SAM's own docs for this connector are explicit that the platform cannot
    # police what SQL an agent runs: "Agent Mesh cannot restrict what queries
    # agents execute - access control must be configured at the database
    # level. For security, use credentials with minimal necessary permissions
    # (e.g., read-only, limited to specific schemas)."
    #
    # So `history_reader` is granted SELECT and nothing else - no INSERT,
    # UPDATE, DELETE, DROP, or CREATE (see db/init/002-roles.sh, and the
    # verification steps in the README). Even if the agent decides to emit a
    # DELETE, Postgres refuses it. That is what makes "SAM only ever reads
    # this data" a guarantee rather than a hope: the writer is the separate,
    # non-AI market-history service, which itself holds a different role.
    # ---------------------------------------------------------------------
    username: history_reader
    password: ${MARKET_HISTORY_READER_PASSWORD, history_reader}
